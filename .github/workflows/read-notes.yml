name: Read Notes

# Manual only. Prints all rows from the notes D1 table to the job log so
# they can be read back via the GitHub Actions API — a fallback for when
# the Cloudflare MCP connector isn't available. Read-only, no side effects.
on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Query notes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute geopolitics-atlas-notes --remote --command="SELECT id, text, page, created_at FROM notes ORDER BY created_at DESC" --json
