name: Deploy Notes Worker

# Manual only: this deploys to Cloudflare (creates/updates a D1 database
# and a Worker), so it should not fire automatically on every push.
# Run it from the Actions tab, or via the API, whenever worker/ changes.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ! npx wrangler whoami; then
            echo "::error::wrangler whoami failed — CLOUDFLARE_API_TOKEN is missing, invalid, or lacks Account-level access. Check Settings > Secrets and variables > Actions > CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - name: Ensure D1 database exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="geopolitics-atlas-notes") | .uuid')
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Database not found, creating it..."
            npx wrangler d1 create geopolitics-atlas-notes
            DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="geopolitics-atlas-notes") | .uuid')
          fi
          echo "Using D1 database id: $DB_ID"
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Apply schema (idempotent — CREATE TABLE IF NOT EXISTS)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute geopolitics-atlas-notes --remote --file=./schema.sql

      - name: Write database_id into wrangler config
        run: sed -i "s/REPLACE_WITH_DATABASE_ID/${DB_ID}/" wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
